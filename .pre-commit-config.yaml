repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Recorded cargo test output: libtest prints "test name ... " with a trailing
        # space before a test's own output, and the fixtures keep it byte for byte.
        exclude: ^tests/fixtures/libtest/rust-.*\.txt$
      - id: check-added-large-files
        # The demo git bundle (full strsim-rs history up to the fix) is about 650 KB.
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict (src)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
