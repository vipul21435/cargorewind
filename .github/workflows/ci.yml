name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests with coverage gate
        run: make cov

  docker:
    name: docker build and demo
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install
        run: make install
      - name: Offline demo (replayed Docker runs)
        run: make demo
      - name: Offline verify of the demo bundle (replayed Docker runs)
        run: make verify-demo
      - name: Offline toolchain inference demo
        run: make toolchain-demo
      - name: Offline date-bounded lockfile demo (replayed pin loop)
        run: make lock-demo
      - name: Build the CLI image and run the demo in it
        run: make docker-demo IMAGE=cargorewind:ci
      - name: Live end-to-end runs through Docker (strsim-rs flip, which-rs pin loop)
        run: make e2e
